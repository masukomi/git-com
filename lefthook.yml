skip_output:
  - meta
  - skips
pre-commit:
  parallel: true
  scripts:
    "bad_words":
      exclude: "Gemfile|Gemfile.lock"
      runner: bash
      tags: bad_words
    "go_tester":
      runner: bash
      tags: testing
    # always_fails is here for testing
    # failure of pre-commit hooks
    # and git-com's ability to store
    # and retrieve commit messages
    # EX_TEMPFAIL (75)
    # "always_fails":
    #   run: bash -c "echo 'testing failing pre-commit'; exit 75"
    #   tags: testing
